<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Maps — Startup Readiness</title>
<!--
  Milestone Maps — Startup Readiness Map (redesign).
  Self-contained Wix HTML/Embed document. Paste into a Wix "Embed HTML" element and publish.

  Design: claude.ai/design "Milestone Maps UI redesign" (dirs 2b desktop / 2a mobile, dark = 3a/3b).
  Data: unchanged — fetches GET /_functions/providers (Velo backend/http-functions.js). Coaches
  (type:'coach') + resources (type:'tap') are placed at a stop when
  provider.stops[activeLine].includes(String(currentStop)) (CMS stores stop numbers as strings).

  Responsive: horizontal line (2b) at >=640px, focus stepper (2a) below. No inner scroll.
  Theme: light by default. To use the dark (ink) variant, set MM_THEME='dark' below, or add
  ?theme=dark to the embed's URL. It also follows the visitor's OS dark mode when MM_THEME='auto'.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  /* ---------- Lean Rocket Lab design tokens (light) ---------- */
  :root{
    --yellow-500:#f8b932; --yellow-600:#e0a41e;
    --teal-500:#05998c; --teal-600:#047c72;
    --green-500:#3fae6b; --violet-500:#7c6cf0;
    --ink-900:#171717; --brand:#f8b932;
    --surface:#ffffff; --surface-sunken:#efeff2;
    --text:#171717; --text-secondary:#6b6b73; --text-muted:#7c7c84;
    --border:#e6e6ea; --border-strong:#d8d8dd;
    --accent-tint:#dbf1ef;
    --shadow-sm:0 1px 3px rgba(0,0,0,.06);
    --font-display:'Montserrat',system-ui,sans-serif;
    --font-body:'Hanken Grotesk',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:transparent;font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}

  /* card frame around the map (mirrors the design's dv-card) */
  .mm-wrap{max-width:860px;margin:0 auto;padding:8px}
  .mm-wrap.narrow{max-width:520px}
  .mm{font-family:var(--font-body);background:var(--surface);color:var(--text);
      --lc:var(--yellow-500);--lct:var(--ink-900);
      border:1px solid var(--border);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden}

  .mm-hd{padding:22px 26px 0}
  .mm-eye{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;color:var(--lc)}
  .mm-title{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;font-size:23px;line-height:1.1;margin:7px 0 5px}
  .mm-sub{font-size:12.5px;line-height:1.5;color:var(--text-secondary);max-width:56ch}
  .mm-tabs{display:flex;gap:7px;padding:16px 26px 0;flex-wrap:wrap}
  .mm-tab{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.03em;padding:7px 13px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .14s}
  .mm-tab .d{width:9px;height:9px;border-radius:50%}
  .mm-tab:hover{border-color:var(--tc);color:var(--text)}
  .mm-tab.on{background:var(--surface-sunken);color:var(--text);border-color:var(--tc);box-shadow:inset 0 -2px 0 var(--tc)}
  .mm-block .k{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--text-muted);margin-bottom:5px}
  .mm-block.next .k{color:var(--lc)}
  .mm-block .v{font-size:13.5px;line-height:1.5;color:var(--text)}
  .mm-btn{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.03em;padding:9px 15px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s}
  .mm-btn:hover:not(:disabled){background:var(--surface-sunken)}
  .mm-btn:active:not(:disabled){transform:translateY(1px)}
  .mm-btn:disabled{opacity:.32;cursor:default}

  /* ---------- A: horizontal line (2b) ---------- */
  .mmA-track{position:relative;padding:30px 34px 6px}
  .mmA-rail{position:absolute;left:50px;right:50px;top:44px;height:7px;border-radius:5px;background:var(--surface-sunken)}
  .mmA-fill{position:absolute;left:50px;top:44px;height:7px;border-radius:5px;background:var(--lc);transition:width .3s cubic-bezier(.2,0,.1,1)}
  .mmA-stops{position:relative;display:flex;justify-content:space-between}
  .mmA-stop{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;border:3px solid var(--lc);background:var(--surface);color:var(--text-secondary);font-family:var(--font-mono);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .mmA-stop:hover{transform:scale(1.14)}
  .mmA-stop.on{background:var(--lc);color:var(--lct);transform:scale(1.2);box-shadow:0 0 0 5px color-mix(in srgb,var(--lc) 20%,transparent)}
  .mmA-detail{margin:8px 26px 20px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .mmA-dhead{background:var(--lc);color:var(--lct);padding:15px 20px;display:flex;align-items:center;gap:14px}
  .mmA-dnum{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--lct) 15%,transparent);font-family:var(--font-mono);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mmA-dtitle{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.15}
  .mmA-dstage{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;opacity:.72;text-transform:uppercase}
  .mmA-dbody{padding:18px 20px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
  .mmA-nav{display:flex;justify-content:space-between;gap:10px;padding:0 20px 18px}

  /* ---------- C: stepper focus card (2a) ---------- */
  .mmC{padding:12px 26px 24px}
  .mmC-rail{display:flex;gap:5px;margin:8px 0 18px}
  .mmC-tick{flex:1;height:7px;border-radius:4px;background:var(--surface-sunken);cursor:pointer;transition:background .18s}
  .mmC-tick:hover{background:var(--border-strong)}
  .mmC-tick.done{background:color-mix(in srgb,var(--lc) 45%,var(--surface-sunken))}
  .mmC-tick.on{background:var(--lc)}
  .mmC-card{border:1px solid var(--border);border-top:3px solid var(--lc);border-radius:14px;padding:22px;box-shadow:var(--shadow-sm)}
  .mmC-meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
  .mmC-big{display:flex;align-items:center;gap:16px;margin:9px 0 16px}
  .mmC-num{width:56px;height:56px;border-radius:14px;background:var(--lc);color:var(--lct);font-family:var(--font-mono);font-weight:700;font-size:25px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mmC-t{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.12}
  .mmC-blocks{display:grid;gap:16px;margin-bottom:18px}
  .mmC-nav{display:flex;align-items:center;gap:10px}
  .mmC-nav .sp{flex:1}

  /* ---------- people: coaches + resources ---------- */
  .mm-people{padding:2px 26px 20px}
  .mm-people-hd{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:10.5px;color:var(--text-muted);margin:10px 0 12px}
  .mm-filter{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
  .mm-filter-lbl{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:9.5px;color:var(--text-muted);margin-right:3px}
  .mm-chip{font-family:var(--font-body);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:background .14s,border-color .14s,color .14s}
  .mm-chip:hover{border-color:var(--lc);color:var(--text)}
  .mm-chip.on{background:var(--lc);color:var(--lct);border-color:var(--lc)}
  .mm-grp{margin-bottom:16px}
  .mm-grp-t{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--text);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .mm-grp-t .gi{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--lc);color:var(--lct)}
  .mm-grp-t .cnt{font-family:var(--font-mono);font-weight:700;font-size:10px;color:var(--text-secondary);background:var(--surface-sunken);border-radius:999px;padding:2px 8px}
  .mm-cards{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .mm-cards.three{grid-template-columns:1fr 1fr 1fr}
  .mm-pcard{display:flex;gap:11px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;transition:border-color .14s,box-shadow .14s,transform .14s}
  .mm-pcard:hover{border-color:var(--lc);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
  .mm-av{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;background:var(--brand);color:var(--ink-900);overflow:hidden}
  .mm-av img{width:100%;height:100%;object-fit:cover}
  .mm-av.res{background:var(--accent-tint);color:var(--teal-600);border:1.5px solid var(--teal-500)}
  .mm-pc-body{min-width:0}
  .mm-pc-nm{font-weight:700;font-size:12.5px;color:var(--text);line-height:1.2}
  .mm-pc-org{font-size:10.5px;color:var(--text-secondary);margin:1px 0 7px}
  .mm-tags{display:flex;flex-wrap:wrap;gap:4px}
  .mm-tag{font-size:9.5px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:var(--surface-sunken);color:var(--text-secondary)}
  .mm-empty{font-size:11.5px;color:var(--text-muted);font-style:italic;padding:2px 0 6px}
  .mm-loading{padding:26px;font-size:12.5px;color:var(--text-muted)}
  .mm-pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}
  .mm-pg{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:background .14s,border-color .14s}
  .mm-pg:hover:not(:disabled){background:var(--surface-sunken);border-color:var(--lc)}
  .mm-pg:active:not(:disabled){transform:translateY(1px)}
  .mm-pg:disabled{opacity:.3;cursor:default}
  .mm-pg-lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.02em}

  /* ---------- dark surface variant (3a/3b) ---------- */
  .mm.dark{
    --surface:#171717;--surface-sunken:#212124;--text:#f4f3ef;--text-secondary:#b7b5ae;
    --text-muted:#86847d;--border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.22);
    --accent-tint:color-mix(in srgb,var(--teal-500) 20%,#171717);
    background:var(--surface);color:var(--text);border-color:rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .mm.dark .mmA-detail,.mm.dark .mmC-card,.mm.dark .mm-pcard{background:#1c1c1f}
  .mm.dark .mmA-stop{background:#1c1c1f}
  .mm.dark .mm-pc-org{color:var(--text-secondary)}
</style>
</head>
<body>
<div class="mm-wrap" id="wrap"><div class="mm" id="root"><div class="mm-loading">Loading…</div></div></div>

<script>
(function(){
  "use strict";

  /* ===== config ===== */
  // Absolute site URL: the Wix Embed runs in a sandboxed iframe on a different origin, so a relative
  // path would miss the site. The backend sends Access-Control-Allow-Origin to permit this call.
  var PROVIDERS_URL = 'https://leanrocketlab.org/_functions/providers';
  // 'light' | 'dark' | 'auto' (auto follows the visitor's OS setting). ?theme= overrides.
  var MM_THEME = 'light';
  var INTAKE_URL = 'https://www.leanrocketlab.org/new-client-intake-form';
  var MOBILE_MAX = 640; // < this width => stepper (2a); otherwise horizontal (2b)
  var PAGE_SIZE = 6;    // max coaches / resources shown per stop before paginating each group

  /* ===== per-line content (from the design's logic class) ===== */
  // Each stop = [title, "you're here" sentence, "to reach next" sentence].
  var LINES = {
    MRL: { name:'Manufacturing Line',
      sub:'Can you make it — repeatably, at cost, at volume? Based on the DoD Manufacturing Readiness Levels (1–10).',
      stops:[
        ['Basic implications identified',"You know making it will matter someday, but haven't studied how.",'Name candidate materials and your biggest manufacturing unknowns.'],
        ['Manufacturing concepts identified','You can describe how it might be made — on paper.','Prove a key manufacturing process in a lab experiment.'],
        ['Proof of concept',"You've made a piece of it once, by hand, in a lab.",'Produce the critical elements repeatably in a lab environment.'],
        ['Lab-level capability','You can make the technology in a lab, on purpose.','Build prototype parts on production-relevant processes.'],
        ['Prototype components','Real components come off realistic processes.','Build prototype systems and complete a make/buy analysis.'],
        ['Prototype system',"A whole system, built the way you'd build it for real.",'Run it on a production-representative line.'],
        ['Production-representative line','Your line is starting to look like a factory.','Demonstrate a pilot line that hits requirements.'],
        ['Pilot line demonstrated','The pilot line is making conforming units.','Start and stabilize low-rate production.'],
        ['Low-rate production',"You're producing steadily at low volume.",'Prove full-rate production with lean practices in place.'],
        ['Full-rate production',"You're a manufacturer, at volume.",'Terminus — drive continuous improvement and cost down.'],
      ] },
    TRL: { name:'Technology Line',
      sub:'Does the technology actually work in the real world? Based on the NASA/DoD Technology Readiness Levels (1–9).',
      stops:[
        ['Basic principles observed','Science says it should be possible.','Formulate a specific technology concept or application.'],
        ['Concept formulated',"You've named the invention and its use, on paper.",'Prove the critical function experimentally.'],
        ['Proof of concept','The critical function works in the lab.','Integrate the pieces into a validated breadboard.'],
        ['Component validation in lab','The pieces work together on a bench.','Validate the integration in a realistic environment.'],
        ['Validation in relevant environment','It survives conditions like the real world.','Demonstrate a prototype in a relevant environment.'],
        ['Prototype in relevant environment','A real prototype, tested hard.','Demonstrate it in an actual operational environment.'],
        ['Prototype in operational environment','It works where it will actually be used.','Complete and qualify the full system.'],
        ['System complete & qualified','Built, tested, qualified — ready to fly.','Prove it in real missions or commercial use.'],
        ['Proven in operations','Flight-proven in real-world use.','Terminus — invest in the next generation.'],
      ] },
    CRL: { name:'Commercial Line',
      sub:'Will anyone buy it — profitably, repeatedly, at scale? Based on the Commercial Readiness Levels (1–9).',
      stops:[
        ['Commercial hypothesis',"You believe there's a market — that's it.",'Run a first-pass market and competitive analysis.'],
        ['Market & competitive analysis',"You've mapped the market on paper.",'Write a testable value proposition.'],
        ['Value proposition defined',"You can pitch the 'why buy' — now test it.",'Validate problem/solution fit with early adopters.'],
        ['Customer validation','Early adopters agree you solve their problem.','Validate pricing, channel, and unit economics.'],
        ['Business model validated','The math works on a small scale.','Close your first paying customers or funded pilots.'],
        ['First sales & funded pilots','Money is changing hands.','Launch with a repeatable, documented sales process.'],
        ['Commercial launch','Open for business, repeatably.','Scale share, segments, and the supply chain.'],
        ['Scaling',"Growth mode — don't break the machine.",'Reach sustained, profitable, widespread deployment.'],
        ['Sustained commercial operation','A real, durable business.','Terminus — expand the portfolio or exit.'],
      ] },
    IRL: { name:'Investment Line',
      sub:'How fundable are you — evidence, not opinion? Steve Blank’s Investment Readiness Levels (1–9).',
      stops:[
        ['Business model canvas complete','A first full sketch of the business — every box a hypothesis.','Size the market and rank your riskiest assumptions.'],
        ['Market size & competition','The opportunity is quantified.','Get out of the building and validate the problem.'],
        ['Problem/solution validation','Customers confirm the pain is real.','Build a low-fidelity MVP to test the solution.'],
        ['Low-fidelity MVP',"Something testable is in users' hands.",'Show real product/market-fit signals.'],
        ['Product/market fit','Customers pull the product from you.','Validate channels and revenue streams.'],
        ['Revenue model validated','You know how money flows in.','Build a high-fidelity MVP and prove the sales motion.'],
        ['High-fidelity MVP','The near-final product proves the model.','Validate costs, key partners, and resources.'],
        ['Cost side validated','You know what it truly costs to deliver.','Assemble the metrics investors will diligence.'],
        ['Metrics that matter','A validated, fundable machine.','Terminus — raise scaling capital on your terms.'],
      ] },
  };
  var LINE_ORDER = ['MRL','TRL','CRL','IRL'];
  var COLORS = { MRL:'var(--yellow-500)', TRL:'var(--teal-500)', CRL:'var(--green-500)', IRL:'var(--violet-500)' };
  var LCT    = { MRL:'var(--ink-900)', TRL:'#fff', CRL:'#fff', IRL:'#fff' };

  /* ===== state ===== */
  var state = { line:'MRL', stop:1, providers:[], coachPage:0, resPage:0, activeTag:null };
  var root = document.getElementById('root');
  var wrap = document.getElementById('wrap');

  /* ===== helpers ===== */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(nm){ return String(nm||'').replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).filter(Boolean).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase() || '·'; }
  function isMobile(){ return window.matchMedia('(max-width:'+(MOBILE_MAX-1)+'px)').matches; }
  function resolveTheme(){
    var q = (new URLSearchParams(location.search)).get('theme');
    var t = (q==='dark'||q==='light'||q==='auto') ? q : MM_THEME;
    if (t==='auto') return window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    return t==='dark' ? 'dark' : 'light';
  }

  /* ===== view model (ported from the design's buildView) ===== */
  function buildView(){
    var lk = state.line, line = LINES[lk], total = line.stops.length, cur = clamp(state.stop,1,total);
    state.stop = cur;
    var isLast = cur >= total;
    var stopRow = line.stops[cur-1];
    var nextLabel = isLast ? 'the terminus' : (lk+' '+(cur+1)+' · '+line.stops[cur][0]);

    var stops = line.stops.map(function(row,i){
      var n = i+1;
      return { n:n, title:row[0], active:n===cur,
        cls: n===cur?'on':'', tickCls: n===cur?'on':(n<cur?'done':'') };
    });

    // providers at this stop — CMS stores stop numbers as strings, so compare as strings.
    var at = state.providers.filter(function(p){
      var arr = (p.stops && p.stops[lk]) || [];
      return arr.map(String).indexOf(String(cur)) !== -1;
    });
    function toCard(p){
      return { name:p.name||'', org:p.org||'', photo:p.photo||null, initials:initials(p.name),
        url: p.website || INTAKE_URL,
        tags: (p.services||[]).slice(0,3) };
    }
    var coachesAll = at.filter(function(p){return p.type==='coach';}).map(toCard);
    var resourcesAll = at.filter(function(p){return p.type==='tap'||p.type==='resource';}).map(toCard);

    // Tag filter: the union of the tags shown across coaches + resources at THIS stop. Clicking one
    // narrows both groups to providers carrying it; clicking again clears. (Re-added from dir 1a.)
    var tagSet = {};
    coachesAll.concat(resourcesAll).forEach(function(c){ c.tags.forEach(function(t){ tagSet[t] = 1; }); });
    var allTags = Object.keys(tagSet).sort();
    var activeTag = (state.activeTag && tagSet[state.activeTag]) ? state.activeTag : null; // clear if absent here
    function byTag(list){ return activeTag ? list.filter(function(c){ return c.tags.indexOf(activeTag) !== -1; }) : list; }
    var coaches = byTag(coachesAll), resources = byTag(resourcesAll);

    return {
      lk:lk, total:total, cur:cur, isLast:isLast,
      color:COLORS[lk], lct:LCT[lk], lineName:line.name, sub:line.sub, stops:stops,
      fillW: total>1 ? 'calc((100% - 100px) * '+((cur-1)/(total-1))+')' : '0px',
      stop:{ n:cur, title:stopRow[0], here:stopRow[1], next:stopRow[2], nextLabel:nextLabel,
             stageLabel: lk+' · Stage '+cur+' of '+total },
      coaches:coaches, resources:resources, allTags:allTags, activeTag:activeTag,
    };
  }
  function clamp(n,a,b){ n=Number(n)||1; return n<a?a:(n>b?b:n); }
  function clamp0(n,a,b){ n=Number(n)||0; return n<a?a:(n>b?b:n); } // 0-valid (page indices)

  /* ===== render pieces ===== */
  function tabsHtml(v){
    return '<div class="mm-tabs">' + LINE_ORDER.map(function(k){
      return '<button class="mm-tab '+(k===v.lk?'on':'')+'" style="--tc:'+COLORS[k]+'" data-act="line" data-k="'+k+'">'
        + '<span class="d" style="background:'+COLORS[k]+'"></span>'+k+'</button>';
    }).join('') + '</div>';
  }
  function headerHtml(v){
    return '<div class="mm-hd"><div class="mm-eye">Milestone Map</div>'
      + '<div class="mm-title">'+esc(v.lineName)+'</div>'
      + '<div class="mm-sub">'+esc(v.sub)+'</div></div>';
  }
  function avatarHtml(p,res){
    var inner = p.photo ? '<img src="'+esc(p.photo)+'" alt="">' : esc(p.initials);
    return '<div class="mm-av'+(res?' res':'')+'">'+inner+'</div>';
  }
  function cardHtml(p,res){
    var tags = p.tags.map(function(t){return '<span class="mm-tag">'+esc(t)+'</span>';}).join('');
    return '<a class="mm-pcard" href="'+esc(p.url)+'" target="_blank" rel="noopener">'
      + avatarHtml(p,res)
      + '<div class="mm-pc-body"><div class="mm-pc-nm">'+esc(p.name)+'</div>'
      + '<div class="mm-pc-org">'+esc(p.org)+'</div>'
      + '<div class="mm-tags">'+tags+'</div></div></a>';
  }
  function pageCount(total){ return Math.max(1, Math.ceil(total / PAGE_SIZE)); }
  function pagerHtml(kind, page, total){
    var pages = pageCount(total);
    var start = page * PAGE_SIZE + 1, end = Math.min((page + 1) * PAGE_SIZE, total);
    return '<div class="mm-pager">'
      + '<button class="mm-pg" data-act="pg'+kind+'" data-dir="-1"'+(page<=0?' disabled':'')+' aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>'
      + '<span class="mm-pg-lbl">'+start+'–'+end+' of '+total+'</span>'
      + '<button class="mm-pg" data-act="pg'+kind+'" data-dir="1"'+(page>=pages-1?' disabled':'')+' aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>'
      + '</div>';
  }
  // kind: 'c' (coach) | 'r' (resource); page is the current page index for that group.
  function groupHtml(v, title, icon, list, res, three, kind, page){
    var total = list.length;
    var pg = Math.min(Math.max(0, page || 0), pageCount(total) - 1);
    var shown = list.slice(pg * PAGE_SIZE, pg * PAGE_SIZE + PAGE_SIZE);
    var body;
    if (total){
      body = '<div class="mm-cards'+(three?' three':'')+'">'+shown.map(function(p){return cardHtml(p,res);}).join('')+'</div>';
      if (total > PAGE_SIZE) body += pagerHtml(kind, pg, total);
    } else {
      body = '<div class="mm-empty">No '+(res?'resource':'coach')+' tagged here yet — ask your LRL advisor'+(res?'.':' for an intro.')+'</div>';
    }
    return '<div class="mm-grp"><div class="mm-grp-t"><span class="gi"><i class="fa-solid '+icon+'"></i></span>'
      + title+' <span class="cnt">'+total+'</span></div>'+body+'</div>';
  }
  function filterHtml(v){
    if (v.allTags.length < 2) return ''; // nothing to filter with 0–1 tag
    var chips = v.allTags.map(function(t){
      return '<button class="mm-chip'+(t===v.activeTag?' on':'')+'" data-act="tag" data-t="'+esc(t)+'">'+esc(t)+'</button>';
    }).join('');
    return '<div class="mm-filter"><span class="mm-filter-lbl">Filter by need</span>'+chips+'</div>';
  }
  function peopleHtml(v, three){
    return '<div class="mm-people"><div class="mm-people-hd">Who can help at this stop</div>'
      + filterHtml(v)
      + groupHtml(v,'Coaches','fa-user-group',v.coaches,false,three,'c',state.coachPage)
      + groupHtml(v,'Resources','fa-toolbox',v.resources,true,three,'r',state.resPage)
      + '</div>';
  }
  function blocksHtml(v){
    return '<div class="mm-block"><div class="k">You’re here</div><div class="v">'+esc(v.stop.here)+'</div></div>'
      + '<div class="mm-block next"><div class="k">To reach '+esc(v.stop.nextLabel)+'</div><div class="v">'+esc(v.stop.next)+'</div></div>';
  }

  function horizontalHtml(v){ // 2b
    var stops = v.stops.map(function(s){
      return '<button class="mmA-stop '+s.cls+'" data-act="pick" data-n="'+s.n+'" title="'+esc(s.title)+'">'+s.n+'</button>';
    }).join('');
    return '<div class="mmA-track"><div class="mmA-rail"></div>'
      + '<div class="mmA-fill" style="width:'+v.fillW+'"></div>'
      + '<div class="mmA-stops">'+stops+'</div></div>'
      + '<div class="mmA-detail"><div class="mmA-dhead"><div class="mmA-dnum">'+v.stop.n+'</div>'
      + '<div><div class="mmA-dstage">'+esc(v.stop.stageLabel)+'</div>'
      + '<div class="mmA-dtitle">'+esc(v.stop.title)+'</div></div></div>'
      + '<div class="mmA-dbody">'+blocksHtml(v)+'</div>'
      + '<div class="mmA-nav"><button class="mm-btn" data-act="prev"'+(v.cur<=1?' disabled':'')+'>← Previous stop</button>'
      + '<button class="mm-btn" data-act="next"'+(v.isLast?' disabled':'')+'>Next stop →</button></div></div>'
      + peopleHtml(v,true);
  }
  function stepperHtml(v){ // 2a
    var ticks = v.stops.map(function(s){
      return '<div class="mmC-tick '+s.tickCls+'" data-act="pick" data-n="'+s.n+'" title="'+esc(s.title)+'"></div>';
    }).join('');
    return '<div class="mmC"><div class="mmC-rail">'+ticks+'</div>'
      + '<div class="mmC-card"><div class="mmC-meta">'+esc(v.stop.stageLabel)+'</div>'
      + '<div class="mmC-big"><div class="mmC-num">'+v.stop.n+'</div><div class="mmC-t">'+esc(v.stop.title)+'</div></div>'
      + '<div class="mmC-blocks">'+blocksHtml(v)+'</div>'
      + '<div class="mmC-nav"><button class="mm-btn" data-act="prev"'+(v.cur<=1?' disabled':'')+'>← Back</button>'
      + '<div class="sp"></div><button class="mm-btn" data-act="next"'+(v.isLast?' disabled':'')+'>Next stop →</button></div></div></div>'
      + peopleHtml(v,false);
  }

  function render(){
    var v = buildView();
    var mobile = isMobile();
    wrap.className = 'mm-wrap' + (mobile?' narrow':'');
    root.className = 'mm' + (resolveTheme()==='dark'?' dark':'');
    root.style.setProperty('--lc', v.color);
    root.style.setProperty('--lct', v.lct);
    root.innerHTML = headerHtml(v) + tabsHtml(v) + (mobile ? stepperHtml(v) : horizontalHtml(v));
  }

  /* ===== interactions (event delegation) ===== */
  root.addEventListener('click', function(e){
    var el = e.target.closest && e.target.closest('[data-act]');
    if (!el || !root.contains(el)) return;
    var act = el.getAttribute('data-act');
    // Paging a group — advance/retreat that group's page only (no stop/line change, no page reset).
    if (act === 'pgc' || act === 'pgr'){
      var dir = Number(el.getAttribute('data-dir')) || 0;
      var v = buildView();
      var key = act === 'pgc' ? 'coachPage' : 'resPage';
      var total = act === 'pgc' ? v.coaches.length : v.resources.length;
      state[key] = clamp0(state[key] + dir, 0, pageCount(total) - 1);
      render();
      return;
    }
    // Toggle a tag filter — narrows both groups; resets their pages (the filtered lists change).
    if (act === 'tag'){ var tg = el.getAttribute('data-t'); state.activeTag = (state.activeTag === tg) ? null : tg; state.coachPage = 0; state.resPage = 0; render(); return; }
    // Changing the stop or line resets the filter + both group pages to the start.
    if (act === 'line'){ var k = el.getAttribute('data-k'); if (LINES[k]){ state.line = k; state.stop = 1; resetPeople(); render(); } return; }
    if (el.tagName === 'A') return; // people cards: let the link open
    if (act === 'pick'){ state.stop = clamp(el.getAttribute('data-n'),1,LINES[state.line].stops.length); resetPeople(); render(); return; }
    if (act === 'prev'){ state.stop = clamp(state.stop-1,1,LINES[state.line].stops.length); resetPeople(); render(); return; }
    if (act === 'next'){ state.stop = clamp(state.stop+1,1,LINES[state.line].stops.length); resetPeople(); render(); return; }
  });
  function resetPeople(){ state.coachPage = 0; state.resPage = 0; state.activeTag = null; }

  // Re-render when crossing the mobile/desktop breakpoint (layout switch) or OS theme (auto).
  var mq = window.matchMedia('(max-width:'+(MOBILE_MAX-1)+'px)');
  (mq.addEventListener ? mq.addEventListener('change', render) : mq.addListener(render));
  var dmq = window.matchMedia('(prefers-color-scheme:dark)');
  (dmq.addEventListener ? dmq.addEventListener('change', render) : dmq.addListener(render));

  /* ===== boot: load providers, then render ===== */
  render(); // paint the map immediately (people fill in once providers load)
  fetch(PROVIDERS_URL, { headers:{ 'Accept':'application/json' } })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ state.providers = (d && Array.isArray(d.providers)) ? d.providers : []; render(); })
    .catch(function(){ state.providers = []; render(); /* map still works; people show empty states */ });
})();
</script>
</body>
</html>
